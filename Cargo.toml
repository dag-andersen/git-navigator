[package]
name = "git-navigator"
version = "0.1.0"
edition = "2024"
description = "A read-only TUI for inspecting changes across Git worktrees"
license = "MIT"

[dependencies]
anyhow = "1.0"
arboard = "3.6"
clap = { version = "4.5", features = ["derive"] }
notify = "8.2"
ratatui = "0.30"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
strip = true
lto = true
codegen-units = 1
